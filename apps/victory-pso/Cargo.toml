[package]
name = "victory-pso"
description = "Standalone builder: console shader containers and pipeline state to host D3D12 pipelines, checked on a chosen adapter. Loads no title."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
victory-core.workspace = true
victory-shader = { workspace = true, features = ["host"] }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
toml.workspace = true
miniz_oxide.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
